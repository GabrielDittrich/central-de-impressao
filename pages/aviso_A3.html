<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/printer-door-open.png">
    <link rel="stylesheet" href="../style/pages/aviso_A3.css">
    <script src="../js/pages/aviso_A3.js" defer></script>
    <title>Aviso em A3</title>
</head>
<body>
    <main class="print-screen">
        <header class="print-toolbar">
            <div>
                <span class="print-toolbar__label">Central de Impressão</span>
                <h1>Aviso em A3</h1>
                <p>A janela de impressão será aberta automaticamente.</p>
            </div>
            <div class="print-toolbar__actions">
                <span class="format-badge">A3 • Paisagem • Aviso</span>
                <button type="button" id="btnPrint" class="print-button">Imprimir</button>
            </div>
        </header>
        <section class="preview-area" aria-label="Pré-visualização da folha A3">
            <div class="page-paper">
                <div id="container"><h1 id="texto"></h1></div>
            </div>
        </section>
    </main>
</body>
</html>
