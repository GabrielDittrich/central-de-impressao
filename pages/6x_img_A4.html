<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/printer-door-open.png" />
    <link rel="stylesheet" href="../style/pages/6x_img_A4.css" />
    <script src="../js/pages/6x_img_A4.js" defer></script>
    <title>Impressão 6x A4</title>
  </head>
  <body>
    <main class="print-screen">
      <header class="print-toolbar">
        <div>
          <span class="print-toolbar__label">Central de Impressão</span>
          <h1>6 imagens em A4</h1>
          <p>A janela de impressão será aberta automaticamente.</p>
        </div>
        <div class="print-toolbar__actions">
          <span class="format-badge">A4 • Paisagem • 6x</span>
          <button type="button" id="btnPrint" class="print-button">
            Imprimir
          </button>
        </div>
      </header>
      <section class="preview-area" aria-label="Pré-visualização da folha A4">
        <div class="page-a4">
          <div class="grid6" id="grid"></div>
        </div>
      </section>
    </main>
  </body>
</html>
